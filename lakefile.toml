name = "PrimeCert"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["PrimeCert"]
testDriver = "PrimeCertTest"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "e2bb1c9060ce89c93a4e5bc6bec9aa6a72af7b43"

[[lean_lib]]
name = "PrimeCert"

[[lean_lib]]
name = "MillerRabin"
globs = ["MillerRabin.+"]

[[lean_lib]]
name = "PrimeCertTest"
globs = ["PrimeCertTest.+"]
