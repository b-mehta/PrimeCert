name: Join four ranges proved in four separate jobs

on:
  push:
    branches:
      - 'ci/carry4'
  workflow_dispatch:

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the mathlib build cache
        run: lake exe cache get

      - name: Prove this part's range
        run: |
          start=$(date +%s)
          lake build PrimeCertTest.Carry4.Part${{ matrix.part }}
          echo "RESULT part ${{ matrix.part }} | wall $(( $(date +%s) - start ))s"
          ls -la .lake/build/lib/lean/PrimeCertTest/Carry4/

      - name: Hand the compiled part to the joining job
        uses: actions/upload-artifact@v4
        with:
          name: carry4-part${{ matrix.part }}
          path: .lake/build/lib/lean/PrimeCertTest/Carry4/Part${{ matrix.part }}.*
          retention-days: 1

  join:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: prove
    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the mathlib build cache
        run: lake exe cache get

      - name: Build what the parts depend on, leaving the parts themselves unbuilt
        run: |
          lake build PrimeCert.PrimeHarmonic PrimeCert.Meta.PrimeHarmonic
          lake build PrimeCert.Meta.Sieve PrimeCert.Meta.QuickRfl
          lake build PrimeCert.SegmentedSieve PrimeCert.GapFold

      - name: Take the four ranges the earlier jobs proved
        uses: actions/download-artifact@v4
        with:
          pattern: carry4-part*
          merge-multiple: true
          path: .lake/build/lib/lean/PrimeCertTest/Carry4/

      - name: Join them into one enclosure without reproving any of them
        run: |
          set +e +o pipefail
          ls -la .lake/build/lib/lean/PrimeCertTest/Carry4/
          export LEAN_PATH=$(lake env printenv LEAN_PATH)
          start=$(date +%s)
          lean -M 8000 PrimeCertTest/Carry4/Join.lean
          code=$?
          echo "RESULT join | exit $code | wall $(( $(date +%s) - start ))s"
          exit "$code"
