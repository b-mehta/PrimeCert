name: A/B of the windowed sum of 1/p

on:
  push:
    branches:
      - 'ci/harmonic-window-ab'
  workflow_dispatch:

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - n: "gapmem"
            rounds: 2
            cases: "GapW0524 GapW1048 GapW2097 GapW4194"
          - n: "gapgrow"
            rounds: 1
            cases: "MemW1048 MemW2097"
          - n: "lenmem"
            rounds: 2
            cases: "Len0768 Len1536 Len3072 Len6144"
    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the mathlib build cache
        run: lake exe cache get

      - name: Build what the cases depend on
        run: |
          lake build PrimeCert.PrimeHarmonic PrimeCert.Meta.PrimeHarmonic
          lake build PrimeCert.Meta.Sieve PrimeCert.Meta.QuickRfl
          lake build PrimeCert.SegmentedSieve
          lake build PrimeCertTest.HarmonicBench.SieveHt12
          lake build PrimeCertTest.HarmonicBench.SieveHt13

      - name: Record the runner
        run: |
          free -m
          nproc
          swapon --show || true

      - name: Run the cases, a discarded warm-up first, the order rotated each round
        run: |
          set +e +o pipefail
          export LEAN_PATH=$(lake env printenv LEAN_PATH)
          export PRIMECERT_PROGRESS=1
          limit=18000
          run_case() {
            f=$1
            tag=$2
            lean -M 12000 -Dtrace.profiler=true -Dtrace.profiler.threshold=0 \
              "PrimeCertTest/HarmonicBench/$f.lean" > "out-$tag.txt" 2>&1 &
            pid=$!
            start=$(date +%s)
            hwm=0
            swap=0
            while kill -0 "$pid" 2>/dev/null; do
              h=$(grep VmHWM "/proc/$pid/status" 2>/dev/null | awk '{print $2}')
              s=$(grep VmSwap "/proc/$pid/status" 2>/dev/null | awk '{print $2}')
              if [ -n "$h" ]; then hwm=$h; fi
              if [ -n "$s" ] && [ "$s" -gt "$swap" ]; then swap=$s; fi
              t=$(( $(date +%s) - start ))
              if [ $(( t % 30 )) -eq 0 ]; then
                echo "$tag t=${t}s hwm=$(( hwm / 1024 )) MB swap=$(( swap / 1024 )) MB"
              fi
              if [ "$t" -gt "$limit" ]; then
                kill "$pid"
                echo "$tag killed at the ${limit}s limit"
              fi
              sleep 1
            done
            wait "$pid"
            code=$?
            total=$(grep -o '\[Kernel\] \[[0-9.]*\]' "out-$tag.txt" \
              | grep -o '[0-9]\+\.[0-9]\+' | awk '{s+=$1} END {printf "%.3f", s}')
            entries=$(grep -c '\[Kernel\] \[' "out-$tag.txt")
            echo "RESULT ${{ matrix.n }} | $tag | exit $code | kernel ${total}s over ${entries} entries | wall $(( $(date +%s) - start ))s | peak ${hwm} KB | swap ${swap} KB"
            grep -oE '\[[A-Za-z_.]+\] \[[0-9.]+\]' "out-$tag.txt" \
              | awk -v tag="$tag" '{c=$1; t=$2; gsub(/[][]/,"",c); gsub(/[][]/,"",t); s[c]+=t; n[c]++}
                  END {for (c in s) printf "CATEGORY %s | %s | %.2f s over %d entries\n", tag, c, s[c], n[c]}' \
              | sort -t'|' -k3 -gr
            if [ "$code" -ne 0 ]; then
              echo "RUN FAILED $tag" | tee -a bench-failures.txt
              grep -E "error|memory" "out-$tag.txt" | tail -5
            fi
          }
          read -ra arr <<< "${{ matrix.cases }}"
          n=${#arr[@]}
          run_case Base0_Startup warmup
          for r in $(seq 1 ${{ matrix.rounds }}); do
            for k in $(seq 0 $(( n - 1 ))); do
              f=${arr[$(( (k + r - 1) % n ))]}
              run_case "$f" "$f-round$r"
            done
          done

      - name: Fail the job if any case failed
        run: |
          if [ -s bench-failures.txt ]; then
            cat bench-failures.txt
            exit 1
          fi

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-ab-${{ matrix.n }}
          path: out-*.txt

  elab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the mathlib build cache
        run: lake exe cache get

      - name: Build what the two files depend on
        run: |
          lake build PrimeCert.PrimeHarmonic PrimeCert.Meta.PrimeHarmonic
          lake build PrimeCert.Meta.Sieve PrimeCert.Meta.QuickRfl
          lake build PrimeCert.SegmentedSieve

      - name: Time each file with the kernel checking and with it switched off
        run: |
          set +e +o pipefail
          export LEAN_PATH=$(lake env printenv LEAN_PATH)
          for r in 1 2; do
            for f in Ht09_W4 Gap09; do
              for mode in on off; do
                flag=""
                if [ "$mode" = "off" ]; then flag="-Ddebug.skipKernelTC=true"; fi
                start=$(date +%s)
                lean -M 10000 $flag "PrimeCertTest/HarmonicBench/$f.lean" \
                  > "out-$f-$mode-$r.txt" 2>&1
                code=$?
                w=$(( $(date +%s) - start ))
                echo "RESULT elab | $f | checking $mode | round $r | exit $code | wall ${w}s"
              done
            done
          done

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-ab-elab
          path: out-*.txt

  onefour:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the mathlib build cache
        run: lake exe cache get

      - name: Build what the four files depend on
        run: |
          lake build PrimeCert.PrimeHarmonic PrimeCert.Meta.PrimeHarmonic
          lake build PrimeCert.Meta.Sieve PrimeCert.Meta.QuickRfl
          lake build PrimeCert.SegmentedSieve

      - name: Time one file alone against four at once, on one runner
        run: |
          set +e +o pipefail
          run_build() {
            tgt=$1
            tag=$2
            segs=$3
            start=$(date +%s)
            lake build "PrimeCertTest.HarmonicBench.$tgt" > "out-of-$tag.txt" 2>&1 &
            pid=$!
            peak=0
            while kill -0 "$pid" 2>/dev/null; do
              r=$(ps -o rss= -C lean | awk '{s+=$1} END {print s+0}')
              if [ "$r" -gt "$peak" ]; then peak=$r; fi
              sleep 1
            done
            wait "$pid"
            code=$?
            w=$(( $(date +%s) - start ))
            echo "RESULT onefour | $tag | exit $code | wall ${w}s over ${segs} segments | peak ${peak} KB"
            if [ "$code" -ne 0 ]; then tail -5 "out-of-$tag.txt"; fi
            rm -rf .lake/build/lib/lean/PrimeCertTest/HarmonicBench
          }
          for r in 1 2; do
            run_build Q0 "one-r$r" 24
            run_build QAll "four-r$r" 96
          done

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-ab-onefour
          path: out-of-*.txt

  common:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the mathlib build cache
        run: lake exe cache get

      - name: Build what the four cases depend on
        run: |
          lake build PrimeCert.PrimeHarmonic PrimeCert.Meta.PrimeHarmonic
          lake build PrimeCert.Meta.Sieve PrimeCert.Meta.QuickRfl
          lake build PrimeCert.SegmentedSieve

      - name: Break a segment into kernel, addDecl and the rest, at both parameter sets
        run: |
          set +e +o pipefail
          export LEAN_PATH=$(lake env printenv LEAN_PATH)
          run_case() {
            d=$1
            f=$2
            tag=$3
            /usr/bin/time -f "TIME $tag user %U sys %S wall %e" -o "time-$tag.txt" \
              lean -M 12000 -DElab.async=false \
              -Dtrace.profiler=true -Dtrace.profiler.threshold=0 \
              "PrimeCertTest/$d/$f.lean" > "out-$tag.txt" 2>&1
            code=$?
            cat "time-$tag.txt"
            grep -oE '\[[A-Za-z_.]+\] \[[0-9.]+\]' "out-$tag.txt" \
              | awk -v tag="$tag" '{c=$1; t=$2; gsub(/[][]/,"",c); gsub(/[][]/,"",t); s[c]+=t; n[c]++}
                  END {for (c in s) printf "CATEGORY %s | %s | %.2f s over %d entries\n", tag, c, s[c], n[c]}' \
              | sort -t'|' -k3 -gr | head -12
            grep -oE "stripeSort total [0-9]+ ms" "out-$tag.txt" \
              | awk -v tag="$tag" '{s+=$3; n++} END {printf "STRIPESORT %s | %d ms over %d calls\n", tag, s+0, n+0}'
            echo "RESULT common | $tag | exit $code"
            if [ "$code" -ne 0 ]; then tail -5 "out-$tag.txt"; fi
          }
          for r in 1 2; do
            run_case SegTune S7_Mine "mine-sieve-r$r"
            run_case HarmonicBench GapW1048 "mine-full-r$r"
            run_case SegTune S7_Sched "theirs-sched-r$r"
            run_case SegTune S9_Stripes "theirs-stripes-r$r"
          done

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-ab-common
          path: |
            out-*.txt
            time-*.txt

  len:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the mathlib build cache
        run: lake exe cache get

      - name: Build what the four files depend on
        run: |
          lake build PrimeCert.PrimeHarmonic PrimeCert.Meta.PrimeHarmonic
          lake build PrimeCert.Meta.Sieve PrimeCert.Meta.QuickRfl
          lake build PrimeCert.SegmentedSieve

      - name: Time each batch length and each width with the kernel checking and without
        run: |
          set +e +o pipefail
          export LEAN_PATH=$(lake env printenv LEAN_PATH)
          for r in 1 2; do
            for f in Len0768 Len1536 Len3072 Len6144 GapW0262 GapW0524 GapW1048 GapW2097; do
              for mode in on off; do
                flag=""
                if [ "$mode" = "off" ]; then flag="-Ddebug.skipKernelTC=true"; fi
                start=$(date +%s)
                lean -M 10000 $flag "PrimeCertTest/HarmonicBench/$f.lean" \
                  > "out-$f-$mode-$r.txt" 2>&1
                code=$?
                echo "RESULT len | $f | checking $mode | round $r | exit $code | wall $(( $(date +%s) - start ))s"
                if [ "$code" -ne 0 ]; then tail -5 "out-$f-$mode-$r.txt"; fi
              done
            done
          done

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-ab-len
          path: out-*.txt

  four:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the mathlib build cache
        run: lake exe cache get

      - name: Build what the four files depend on
        run: |
          lake build PrimeCert.PrimeHarmonic PrimeCert.Meta.PrimeHarmonic
          lake build PrimeCert.Meta.Sieve PrimeCert.Meta.QuickRfl
          lake build PrimeCert.SegmentedSieve

      - name: Time four gap-walk files against four position-walk files, alternating
        run: |
          set +e +o pipefail
          run_four() {
            tgt=$1
            tag=$2
            start=$(date +%s)
            lake build "PrimeCertTest.HarmonicBench.$tgt" > "out-four-$tag.txt" 2>&1 &
            pid=$!
            peak=0
            while kill -0 "$pid" 2>/dev/null; do
              r=$(ps -o rss= -C lean | awk '{s+=$1} END {print s+0}')
              n=$(pgrep -c -x lean || echo 0)
              if [ "$r" -gt "$peak" ]; then peak=$r; fi
              t=$(( $(date +%s) - start ))
              if [ $(( t % 60 )) -eq 0 ]; then
                echo "$tag t=${t}s processes ${n} resident $(( r / 1024 )) MB peak $(( peak / 1024 )) MB"
              fi
              sleep 1
            done
            wait "$pid"
            code=$?
            echo "RESULT four | $tag | exit $code | wall $(( $(date +%s) - start ))s | peak ${peak} KB summed over the lean processes"
            if [ "$code" -ne 0 ]; then
              tail -12 "out-four-$tag.txt"
              echo "RUN FAILED $tag" >> four-failures.txt
            fi
            rm -rf .lake/build/lib/lean/PrimeCertTest/HarmonicBench
          }
          run_four ParAll gap-round1
          run_four ParAllW pos-round1
          run_four ParAllW pos-round2
          run_four ParAll gap-round2

      - name: Fail the job if either arm failed
        run: |
          if [ -s four-failures.txt ]; then
            cat four-failures.txt
            exit 1
          fi

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-ab-four
          path: out-four-*.txt

