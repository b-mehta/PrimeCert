name: A/B of the windowed sum of 1/p

on:
  push:
    branches:
      - 'ci/harmonic-window-ab'
  workflow_dispatch:

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - n: "gapmem"
            rounds: 2
            cases: "GapW0524 GapW1048 GapW2097 GapW4194"
          - n: "gapgrow"
            rounds: 1
            cases: "MemW1048 MemW2097"
          - n: "lenmem"
            rounds: 2
            cases: "Len0768 Len1536 Len3072 Len6144"
          - n: "summem"
            rounds: 2
            cases: "Sum0512 Sum1024 Sum2048 Sum4096 Sum8192"
    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the mathlib build cache
        run: lake exe cache get

      - name: Build what the cases depend on
        run: |
          lake build PrimeCert.PrimeHarmonic PrimeCert.Meta.PrimeHarmonic
          lake build PrimeCert.Meta.Sieve PrimeCert.Meta.QuickRfl
          lake build PrimeCert.SegmentedSieve
          lake build PrimeCertTest.HarmonicBench.SieveHt12
          lake build PrimeCertTest.HarmonicBench.SieveHt13

      - name: Record the runner
        run: |
          free -m
          nproc
          swapon --show || true

      - name: Run the cases, a discarded warm-up first, the order rotated each round
        run: |
          set +e +o pipefail
          export LEAN_PATH=$(lake env printenv LEAN_PATH)
          export PRIMECERT_PROGRESS=1
          limit=18000
          run_case() {
            f=$1
            tag=$2
            lean -M 12000 -Dtrace.profiler=true -Dtrace.profiler.threshold=0 \
              "PrimeCertTest/HarmonicBench/$f.lean" > "out-$tag.txt" 2>&1 &
            pid=$!
            start=$(date +%s)
            hwm=0
            swap=0
            while kill -0 "$pid" 2>/dev/null; do
              h=$(grep VmHWM "/proc/$pid/status" 2>/dev/null | awk '{print $2}')
              s=$(grep VmSwap "/proc/$pid/status" 2>/dev/null | awk '{print $2}')
              if [ -n "$h" ]; then hwm=$h; fi
              if [ -n "$s" ] && [ "$s" -gt "$swap" ]; then swap=$s; fi
              t=$(( $(date +%s) - start ))
              if [ $(( t % 30 )) -eq 0 ]; then
                echo "$tag t=${t}s hwm=$(( hwm / 1024 )) MB swap=$(( swap / 1024 )) MB"
              fi
              if [ "$t" -gt "$limit" ]; then
                kill "$pid"
                echo "$tag killed at the ${limit}s limit"
              fi
              sleep 1
            done
            wait "$pid"
            code=$?
            total=$(grep -o '\[Kernel\] \[[0-9.]*\]' "out-$tag.txt" \
              | grep -o '[0-9]\+\.[0-9]\+' | awk '{s+=$1} END {printf "%.3f", s}')
            entries=$(grep -c '\[Kernel\] \[' "out-$tag.txt")
            echo "RESULT ${{ matrix.n }} | $tag | exit $code | kernel ${total}s over ${entries} entries | wall $(( $(date +%s) - start ))s | peak ${hwm} KB | swap ${swap} KB"
            grep -oE '\[[A-Za-z_.]+\] \[[0-9.]+\]' "out-$tag.txt" \
              | awk -v tag="$tag" '{c=$1; t=$2; gsub(/[][]/,"",c); gsub(/[][]/,"",t); s[c]+=t; n[c]++}
                  END {for (c in s) printf "CATEGORY %s | %s | %.2f s over %d entries\n", tag, c, s[c], n[c]}' \
              | sort -t'|' -k3 -gr
            if [ "$code" -ne 0 ]; then
              echo "RUN FAILED $tag" | tee -a bench-failures.txt
              grep -E "error|memory" "out-$tag.txt" | tail -5
            fi
          }
          read -ra arr <<< "${{ matrix.cases }}"
          n=${#arr[@]}
          run_case Base0_Startup warmup
          for r in $(seq 1 ${{ matrix.rounds }}); do
            for k in $(seq 0 $(( n - 1 ))); do
              f=${arr[$(( (k + r - 1) % n ))]}
              run_case "$f" "$f-round$r"
            done
          done

      - name: Fail the job if any case failed
        run: |
          if [ -s bench-failures.txt ]; then
            cat bench-failures.txt
            exit 1
          fi

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-ab-${{ matrix.n }}
          path: out-*.txt

  common:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the mathlib build cache
        run: lake exe cache get

      - name: Build what the six cases depend on
        run: |
          lake build PrimeCert.PrimeHarmonic PrimeCert.Meta.PrimeHarmonic
          lake build PrimeCert.Meta.Sieve PrimeCert.Meta.QuickRfl
          lake build PrimeCert.SegmentedSieve
          lake build PrimeCertTest.HarmonicBench.SieveHt12
          lake build PrimeCertTest.HarmonicBench.SieveHt14

      - name: Break a segment into kernel, addDecl and the rest, at both parameter sets
        run: |
          set +e +o pipefail
          export LEAN_PATH=$(lake env printenv LEAN_PATH)
          run_case() {
            d=$1
            f=$2
            tag=$3
            /usr/bin/time -f "TIME $tag user %U sys %S wall %e" -o "time-$tag.txt" \
              lean -M 12000 -DElab.async=false \
              -Dtrace.profiler=true -Dtrace.profiler.threshold=0 \
              "PrimeCertTest/$d/$f.lean" > "out-$tag.txt" 2>&1
            code=$?
            cat "time-$tag.txt"
            grep -oE '\[[A-Za-z_.]+\] \[[0-9.]+\]' "out-$tag.txt" \
              | awk -v tag="$tag" '{c=$1; t=$2; gsub(/[][]/,"",c); gsub(/[][]/,"",t); s[c]+=t; n[c]++}
                  END {for (c in s) printf "CATEGORY %s | %s | %.2f s over %d entries\n", tag, c, s[c], n[c]}' \
              | sort -t'|' -k3 -gr | head -12
            grep -oE "stripeSort total [0-9]+ ms" "out-$tag.txt" \
              | awk -v tag="$tag" '{s+=$3; n++} END {printf "STRIPESORT %s | %d ms over %d calls\n", tag, s+0, n+0}'
            echo "RESULT common | $tag | exit $code"
            if [ "$code" -ne 0 ]; then tail -5 "out-$tag.txt"; fi
          }
          for r in 1 2; do
            run_case SegTune S7_Low "mine-low-r$r"
            run_case SegTune S7_Mine "mine-sieve-r$r"
            run_case SegTune S7_High "mine-high-r$r"
            run_case SegTune S7_HighBig "mine-highbig-r$r"
            run_case SegTune S7_Max "mine-max-r$r"
            run_case HarmonicBench GapW1048 "mine-full-r$r"
            run_case SegTune S7_Sched "theirs-sched-r$r"
          done

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-ab-common
          path: |
            out-*.txt
            time-*.txt

  count:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the mathlib build cache
        run: lake exe cache get

      - name: Build what the four files depend on
        run: |
          lake build PrimeCert.PrimeHarmonic PrimeCert.Meta.PrimeHarmonic
          lake build PrimeCert.Meta.Sieve PrimeCert.Meta.QuickRfl
          lake build PrimeCert.SegmentedSieve

      - name: Where throughput saturates, one file through four
        run: |
          set +e +o pipefail
          run_arm() {
            tgt=$1
            tag=$2
            segs=$3
            start=$(date +%s)
            lake build "PrimeCertTest.HarmonicBench.$tgt" > "out-ct-$tag.txt" 2>&1 &
            pid=$!
            peak=0
            while kill -0 "$pid" 2>/dev/null; do
              r=$(ps -o rss= -C lean | awk '{s+=$1} END {print s+0}')
              if [ "$r" -gt "$peak" ]; then peak=$r; fi
              sleep 1
            done
            wait "$pid"
            code=$?
            echo "RESULT count | $tag | exit $code | wall $(( $(date +%s) - start ))s over ${segs} segments | summed peak ${peak} KB"
            if [ "$code" -ne 0 ]; then tail -4 "out-ct-$tag.txt"; fi
            rm -rf .lake/build/lib/lean/PrimeCertTest/HarmonicBench
          }
          for r in 1 2 3; do
            run_arm Split8_Full "n1-r$r" 8
            run_arm SplitFull2All "n2-r$r" 16
            run_arm SplitFull3All "n3-r$r" 24
            run_arm SplitFullAll "n4-r$r" 32
          done

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-ab-count
          path: out-ct-*.txt

  halves:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the mathlib build cache
        run: lake exe cache get

      - name: Build what the eight files depend on
        run: |
          lake build PrimeCert.PrimeHarmonic PrimeCert.Meta.PrimeHarmonic
          lake build PrimeCert.Meta.Sieve PrimeCert.Meta.QuickRfl
          lake build PrimeCert.SegmentedSieve

      - name: One against four, for crossing off alone and for crossing off with summing
        run: |
          set +e +o pipefail
          run_arm() {
            tgt=$1
            tag=$2
            segs=$3
            start=$(date +%s)
            lake build "PrimeCertTest.HarmonicBench.$tgt" > "out-hv-$tag.txt" 2>&1 &
            pid=$!
            peak=0
            while kill -0 "$pid" 2>/dev/null; do
              r=$(ps -o rss= -C lean | awk '{s+=$1} END {print s+0}')
              if [ "$r" -gt "$peak" ]; then peak=$r; fi
              sleep 1
            done
            wait "$pid"
            code=$?
            echo "RESULT halves | $tag | exit $code | wall $(( $(date +%s) - start ))s over ${segs} segments | summed peak ${peak} KB"
            if [ "$code" -ne 0 ]; then tail -4 "out-hv-$tag.txt"; fi
            rm -rf .lake/build/lib/lean/PrimeCertTest/HarmonicBench
          }
          for r in 1 2; do
            run_arm Split8_Sieve "sieve-one-r$r" 8
            run_arm SplitSieveAll "sieve-four-r$r" 32
            run_arm Split8_Full "full-one-r$r" 8
            run_arm SplitFullAll "full-four-r$r" 32
          done

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-ab-halves
          path: out-hv-*.txt

  cores2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the mathlib build cache
        run: lake exe cache get

      - name: Build what the four files depend on
        run: |
          lake build PrimeCert.PrimeHarmonic PrimeCert.Meta.PrimeHarmonic
          lake build PrimeCert.Meta.Sieve PrimeCert.Meta.QuickRfl
          lake build PrimeCert.SegmentedSieve

      - name: One against four at the record's own per-file size, where peak nears the ceiling
        run: |
          set +e +o pipefail
          run_arm() {
            tgt=$1
            tag=$2
            segs=$3
            start=$(date +%s)
            lake build "PrimeCertTest.$tgt" > "out-c2-$tag.txt" 2>&1 &
            pid=$!
            peak=0
            while kill -0 "$pid" 2>/dev/null; do
              r=$(ps -o rss= -C lean | awk '{s+=$1} END {print s+0}')
              if [ "$r" -gt "$peak" ]; then peak=$r; fi
              sleep 1
            done
            wait "$pid"
            code=$?
            echo "RESULT cores2 | $tag | exit $code | wall $(( $(date +%s) - start ))s over ${segs} segments | summed peak ${peak} KB"
            if [ "$code" -ne 0 ]; then tail -4 "out-c2-$tag.txt"; fi
            rm -rf .lake/build/lib/lean/PrimeCertTest/WideA
          }
          for r in 1 2; do
            run_arm WideA.Part00 "one-r$r" 12
            run_arm WideA.All "four-r$r" 48
          done

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-ab-cores2
          path: out-c2-*.txt

  hw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Say what the runner actually has
        run: |
          lscpu | grep -iE "^CPU\(s\)|Thread|Core|Socket|Model name|MHz|cache"
          echo "---"
          nproc
          free -m
          df -h /
          cat /proc/cpuinfo | grep -c ^processor

  cores:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the mathlib build cache
        run: lake exe cache get

      - name: Build what the four files depend on
        run: |
          lake build PrimeCert.PrimeHarmonic PrimeCert.Meta.PrimeHarmonic
          lake build PrimeCert.Meta.Sieve PrimeCert.Meta.QuickRfl
          lake build PrimeCert.SegmentedSieve

      - name: One file alone against four at once, same segments, one runner
        run: |
          set +e +o pipefail
          run_arm() {
            tgt=$1
            tag=$2
            segs=$3
            start=$(date +%s)
            lake build "PrimeCertTest.HarmonicBench.$tgt" > "out-cores-$tag.txt" 2>&1
            code=$?
            w=$(( $(date +%s) - start ))
            echo "RESULT cores | $tag | exit $code | wall ${w}s over ${segs} segments"
            if [ "$code" -ne 0 ]; then tail -4 "out-cores-$tag.txt"; fi
            rm -rf .lake/build/lib/lean/PrimeCertTest/HarmonicBench
          }
          for r in 1 2; do
            run_arm Q0 "one-r$r" 24
            run_arm QAll "four-r$r" 96
          done

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-ab-cores
          path: out-cores-*.txt

  split:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the mathlib build cache
        run: lake exe cache get

      - name: Build what the two files depend on
        run: |
          lake build PrimeCert.PrimeHarmonic PrimeCert.Meta.PrimeHarmonic
          lake build PrimeCert.Meta.Sieve PrimeCert.Meta.QuickRfl
          lake build PrimeCert.SegmentedSieve

      - name: Sieve and sum against sieve alone, over the same eight segments
        run: |
          set +e +o pipefail
          export LEAN_PATH=$(lake env printenv LEAN_PATH)
          run_case() {
            f=$1
            tag=$2
            /usr/bin/time -f "TIME $tag user %U sys %S wall %e maxrss %M KB" \
              -o "time-split-$tag.txt" \
              lean -M 12000 -DElab.async=false \
              -Dtrace.profiler=true -Dtrace.profiler.threshold=0 \
              "PrimeCertTest/HarmonicBench/$f.lean" > "out-split-$tag.txt" 2>&1
            code=$?
            cat "time-split-$tag.txt"
            grep -oE '\[Kernel\] \[[0-9.]+\]' "out-split-$tag.txt" \
              | grep -oE '[0-9]+\.[0-9]+' \
              | awk -v tag="$tag" '{s+=$1; n++} END {printf "KERNEL %s | %.3f s over %d entries\n", tag, s, n}'
            echo "RESULT split | $tag | exit $code"
            if [ "$code" -ne 0 ]; then tail -4 "out-split-$tag.txt"; fi
          }
          for r in 1 2 3; do
            run_case Split8_Full "full-r$r"
            run_case Split8_Sieve "sieve-r$r"
          done

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-ab-split
          path: |
            out-split-*.txt
            time-split-*.txt

  wide:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the mathlib build cache
        run: lake exe cache get

      - name: Build what the eight files depend on
        run: |
          lake build PrimeCert.PrimeHarmonic PrimeCert.Meta.PrimeHarmonic
          lake build PrimeCert.Meta.Sieve PrimeCert.Meta.QuickRfl
          lake build PrimeCert.SegmentedSieve

      - name: Two widths over the same range at one bound, four files each
        run: |
          set +e +o pipefail
          run_arm() {
            tgt=$1
            tag=$2
            start=$(date +%s)
            lake build "PrimeCertTest.$tgt.All" > "out-wide-$tag.txt" 2>&1 &
            pid=$!
            peak=0
            while kill -0 "$pid" 2>/dev/null; do
              r=$(ps -o rss= -C lean | awk '{s+=$1} END {print s+0}')
              if [ "$r" -gt "$peak" ]; then peak=$r; fi
              sleep 1
            done
            wait "$pid"
            code=$?
            echo "RESULT wide | $tag | exit $code | wall $(( $(date +%s) - start ))s | summed peak ${peak} KB"
            if [ "$code" -ne 0 ]; then tail -6 "out-wide-$tag.txt"; fi
            rm -rf .lake/build/lib/lean/PrimeCertTest/WideA .lake/build/lib/lean/PrimeCertTest/WideB
          }
          for r in 1 2; do
            run_arm WideA "w4194304-r$r"
            run_arm WideB "w2097152-r$r"
          done

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-ab-wide
          path: out-wide-*.txt

  floor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the mathlib build cache
        run: lake exe cache get

      - name: Build what the cases import
        run: |
          lake build PrimeCert.PrimeHarmonic PrimeCert.Meta.PrimeHarmonic
          lake build PrimeCert.Meta.Sieve PrimeCert.Meta.QuickRfl
          lake build PrimeCert.SegmentedSieve PrimeCert.GapFold
          lake build PrimeCert.Sieve PrimeCert.SieveCorrect PrimeCert.SieveBase

      - name: Take the maximum resident of a process that only imports
        run: |
          set +e +o pipefail
          export LEAN_PATH=$(lake env printenv LEAN_PATH)
          for r in 1 2 3; do
            for f in F0_Bare F9_Elab F10_Lean F8_Meta F1_Sieve F2_Correct F3_Base F4_Segmented F5_Harmonic F6_Gap F7_All; do
              /usr/bin/time -f "RESULT floor | $f | round $r | maxrss %M KB | wall %e s" \
                -o "time-floor-$f-$r.txt" \
                lean -M 12000 "PrimeCertTest/Floor/$f.lean" > "out-floor-$f-$r.txt" 2>&1
              code=$?
              cat "time-floor-$f-$r.txt"
              if [ "$code" -ne 0 ]; then tail -3 "out-floor-$f-$r.txt"; fi
            done
          done

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-ab-floor
          path: |
            out-floor-*.txt
            time-floor-*.txt

  stagger:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the mathlib build cache
        run: lake exe cache get

      - name: Build what the four files depend on
        run: |
          lake build PrimeCert.PrimeHarmonic PrimeCert.Meta.PrimeHarmonic
          lake build PrimeCert.Meta.Sieve PrimeCert.Meta.QuickRfl
          lake build PrimeCert.SegmentedSieve

      - name: Four files started together against four started apart
        run: |
          set +e +o pipefail
          export LEAN_PATH=$(lake env printenv LEAN_PATH)
          run_arm() {
            gap=$1
            tag=$2
            start=$(date +%s)
            pids=""
            for f in Q0 Q1 Q2 Q3; do
              lean -M 12000 "PrimeCertTest/HarmonicBench/$f.lean" > "out-st-$tag-$f.txt" 2>&1 &
              pids="$pids $!"
              if [ "$gap" -gt 0 ]; then sleep "$gap"; fi
            done
            peak=0
            while pgrep -x lean > /dev/null; do
              r=$(ps -o rss= -C lean | awk '{s+=$1} END {print s+0}')
              if [ "$r" -gt "$peak" ]; then peak=$r; fi
              sleep 1
            done
            code=0
            for p in $pids; do wait "$p" || code=1; done
            echo "RESULT stagger | $tag | gap ${gap}s | exit $code | wall $(( $(date +%s) - start ))s | summed peak ${peak} KB"
          }
          for r in 1 2; do
            run_arm 0 "together-r$r"
            run_arm 85 "apart-r$r"
          done

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-ab-stagger
          path: out-st-*.txt

  len:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the mathlib build cache
        run: lake exe cache get

      - name: Build what the four files depend on
        run: |
          lake build PrimeCert.PrimeHarmonic PrimeCert.Meta.PrimeHarmonic
          lake build PrimeCert.Meta.Sieve PrimeCert.Meta.QuickRfl
          lake build PrimeCert.SegmentedSieve

      - name: Time each batch length and each width with the kernel checking and without
        run: |
          set +e +o pipefail
          export LEAN_PATH=$(lake env printenv LEAN_PATH)
          for r in 1 2; do
            for f in Len0768 Len1536 Len3072 Len6144 GapW0262 GapW0524 GapW1048 GapW2097; do
              for mode in on off; do
                flag=""
                if [ "$mode" = "off" ]; then flag="-Ddebug.skipKernelTC=true"; fi
                start=$(date +%s)
                lean -M 10000 $flag "PrimeCertTest/HarmonicBench/$f.lean" \
                  > "out-$f-$mode-$r.txt" 2>&1
                code=$?
                echo "RESULT len | $f | checking $mode | round $r | exit $code | wall $(( $(date +%s) - start ))s"
                if [ "$code" -ne 0 ]; then tail -5 "out-$f-$mode-$r.txt"; fi
              done
            done
          done

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-ab-len
          path: out-*.txt

