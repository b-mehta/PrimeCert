name: Window sieve tuning

on:
  workflow_dispatch:
  # A manual dispatch resolves the workflow file from the default branch, so while this file sits
  # on a tuning branch alone that route answers 404. A push trigger reads the file from the branch
  # being pushed, so pushing a timing run to `ci/sieve-bench` runs it from that branch's own copy.
  # Keeping the trigger on a branch of its own means ordinary work on `ci/window-sieve-tune` stays
  # clear of a 180 minute job.
  push:
    branches:
      - ci/sieve-bench
      # And a pattern, so each timing run gets a branch of its own and none of them is rewritten.
      - 'ci/bench-**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the mathlib build cache
        run: lake exe cache get
      # `PrimeCert.SkipSound` is here because the cases that carry a proved window import it, and a
      # case whose import has no olean fails in a fifth of a second with nothing timed.
      - name: Build the sieve and its correctness file
        run: >
          lake build PrimeCert.SieveCorrect PrimeCert.Meta.Sieve PrimeCert.SegmentedSieve
          PrimeCert.NoPos PrimeCert.SkipSound
      # Which cases to time comes from PrimeCertTest/SegTune/bench-cases.txt, read from the branch
      # being pushed, so a timing run says what it measures in the same push that starts it. The
      # first line holds the round count and the rest name one case a line, with `#` for comments
      # and blank lines ignored. A branch without the file times WA_Narrow for 3 rounds, which is
      # what this job did before the file existed.
      # A case may import a module that is not one of the sieve targets, a prebuilt base sieve for
      # instance. Such a module has no olean here and the case fails in a second, so a branch names
      # what it needs in PrimeCertTest/SegTune/bench-deps.txt, one lake target a line.
      - name: Build what the cases import
        run: |
          set -euo pipefail
          deps=PrimeCertTest/SegTune/bench-deps.txt
          if [ -f "$deps" ]; then
            mapfile -t targets < <(sed -e 's/#.*//' -e 's/[[:space:]]*$//' "$deps" | grep -v '^$')
            if [ ${#targets[@]} -gt 0 ]; then
              printf 'dependency: %s\n' "${targets[@]}"
              # One thread, and a watchdog of this step's own. A dependency that elaborates a large
              # sieve has three times taken the runner down and the job log with it, which reads as
              # a job that simply stopped: no step marked failed, `gh run view --log` answering
              # "log not found". Killing the build a little under the runner's size turns that into
              # a failure anyone can read. DEP_LIMIT_KB adjusts it.
              # A little under run.sh's 14000000 for a case, since a kill there has reliably left
              # the runner alive and this step carries lake as well as lean.
              deplimit=${DEP_LIMIT_KB:-13000000}
              kids() {
                local p=$1 c
                for c in $(pgrep -P "$p" 2>/dev/null || true); do echo "$c"; kids "$c"; done
              }
              LEAN_NUM_THREADS=1 lake build "${targets[@]}" &
              lpid=$!
              depkilled=0
              deppeak=0
              while kill -0 "$lpid" 2>/dev/null; do
                tree=$(kids "$lpid" | tr '\n' ' ')
                rss=$(ps -o rss= -p "$lpid" $tree 2>/dev/null | awk '{s += $1} END {print s+0}')
                if [ "$rss" -gt "$deppeak" ]; then deppeak=$rss; fi
                if [ "$rss" -gt "$deplimit" ]; then
                  kill -9 "$lpid" $tree 2>/dev/null || true
                  depkilled=1
                fi
                sleep 1
              done
              if wait "$lpid"; then depstatus=0; else depstatus=$?; fi
              echo "dependency peak: $deppeak KiB"
              if [ "$depkilled" -eq 1 ]; then
                echo "DEPENDENCY KILLED: resident memory passed $deplimit KiB"
                exit 1
              fi
              if [ "$depstatus" -ne 0 ]; then
                echo "DEPENDENCY BUILD FAILED exit $depstatus"
                exit "$depstatus"
              fi
              echo "dependencies built"
            fi
          fi
      - name: Time the cases this branch asks for
        run: |
          set -euo pipefail
          chmod +x PrimeCertTest/SegTune/run.sh
          list=PrimeCertTest/SegTune/bench-cases.txt
          if [ -f "$list" ]; then
            mapfile -t lines < <(sed -e 's/#.*//' -e 's/[[:space:]]*$//' "$list" | grep -v '^$')
            rounds=${lines[0]}
            cases=("${lines[@]:1}")
          else
            rounds=3
            cases=(WA_Narrow)
          fi
          if [ ${#cases[@]} -eq 0 ]; then
            echo "bench-cases.txt names a round count and no cases"; exit 1
          fi
          echo "rounds: $rounds"
          printf 'case: %s\n' "${cases[@]}"
          # run.sh kills a case above LIMIT_KB, 14000000 by default, which is its own choice and
          # not the runner's size. A branch raises it in bench-limit.txt when a case is close
          # enough to the default to be worth asking. Raising it risks the runner dying with the
          # log, which the default exists to avoid, so it belongs to a run that says why.
          limitfile=PrimeCertTest/SegTune/bench-limit.txt
          if [ -f "$limitfile" ]; then
            LIMIT_KB=$(sed -e 's/#.*//' -e 's/[[:space:]]//g' "$limitfile" | grep -v '^$' | head -1)
            echo "limit: $LIMIT_KB KiB"
            export LIMIT_KB
          fi
          LEAN_FLAGS=-DElab.async=false PrimeCertTest/SegTune/run.sh "$rounds" "${cases[@]}"
      - name: Fail the job if any case failed
        run: |
          if [ -s bench-failures.txt ]; then cat bench-failures.txt; exit 1; fi
