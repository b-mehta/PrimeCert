name: Window sieve tuning

on:
  push:
    branches:
      - 'ci/window-sieve-tune'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the mathlib build cache
        run: lake exe cache get
      - name: Build the sieve and its correctness file
        run: lake build PrimeCert.SieveCorrect PrimeCert.Meta.Sieve PrimeCert.SegmentedSieve
      - name: Split the wall clock of one segment into its parts
        run: |
          chmod +x PrimeCertTest/SegTune/run.sh PrimeCertTest/SegTune/tags.sh
          PrimeCertTest/SegTune/run.sh 1 Base0_Startup S7_Sieve
          TAG=nokernel- LEAN_FLAGS=-Ddebug.skipKernelTC=true \
            PrimeCertTest/SegTune/run.sh 2 V7_M3 V7_M11
          TAG=twin- PrimeCertTest/SegTune/run.sh 2 V7_M3 V7_M11
          PrimeCertTest/SegTune/tags.sh out-*.txt
      - name: Fail the job if any case failed
        run: |
          if [ -s bench-failures.txt ]; then cat bench-failures.txt; exit 1; fi
