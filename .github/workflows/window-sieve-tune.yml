name: Window sieve tuning

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the mathlib build cache
        run: lake exe cache get
      - name: Build the sieve and its correctness file
        run: lake build PrimeCert.SieveCorrect PrimeCert.Meta.Sieve PrimeCert.SegmentedSieve
      - name: Is the window cost change mine or the runner's, both arms paired here
        run: |
          chmod +x PrimeCertTest/SegTune/run.sh
          chmod +x PrimeCertTest/SegTune/pair.sh
          chmod +x PrimeCertTest/SegTune/pair-commits.sh
          RUNNER=pair PrimeCertTest/SegTune/pair-commits.sh HEAD 9df5cde S9_Par1 S9_Par2
      - name: Fail the job if any case failed
        run: |
          if [ -s bench-failures.txt ]; then cat bench-failures.txt; exit 1; fi
