name: Window sieve tuning

on:
  push:
    branches:
      - 'ci/window-sieve-tune'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the mathlib build cache
        run: lake exe cache get
      - name: Build the sieve and its correctness file
        run: lake build PrimeCert.SieveCorrect PrimeCert.Meta.Sieve PrimeCert.SegmentedSieve
      - name: How many files a runner should carry, one to four
        run: |
          lscpu | grep -E '^CPU\(s\)|Thread|Core|Socket|Model name'
          chmod +x PrimeCertTest/SegTune/pair.sh
          for r in 1 2 3; do
            echo "=== round $r"
            if [ $((r % 2)) -eq 1 ]; then
              order="1 2 3 4"
            else
              order="4 3 2 1"
            fi
            for n in $order; do
              echo "-- $n files"
              case $n in
                1) PrimeCertTest/SegTune/pair.sh S9_Par1 ;;
                2) PrimeCertTest/SegTune/pair.sh S9_Par1 S9_Par2 ;;
                3) PrimeCertTest/SegTune/pair.sh S9_Par1 S9_Par2 S9_Par3 ;;
                4) PrimeCertTest/SegTune/pair.sh S9_Par1 S9_Par2 S9_Par3 S9_Par4 ;;
              esac
            done
          done
      - name: Fail the job if any case failed
        run: |
          if [ -s bench-failures.txt ]; then cat bench-failures.txt; exit 1; fi
