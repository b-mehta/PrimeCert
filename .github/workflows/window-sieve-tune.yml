name: Window sieve tuning

on:
  push:
    branches:
      - 'ci/window-sieve-tune'
  workflow_dispatch:

jobs:
  batch-at-1e7:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the mathlib build cache
        run: lake exe cache get
      - name: Build what the cases depend on
        run: lake build PrimeCert.Meta.Sieve PrimeCert.SegmentedSieve
      - name: Batch length, divisors up to 1e7, one round
        run: >
          bash PrimeCertTest/SegTune/run.sh 1 Base0_Startup S7_Sieve
          L7_L1536 L7_L2048 L7_L4096 L7_L8192 L7_L16384
      - name: Fail the job if any case failed
        run: |
          if [ -s bench-failures.txt ]; then
            cat bench-failures.txt
            exit 1
          fi
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-at-1e7-logs
          path: |
            out-*.txt
            time-*.txt

  large-size-at-1e7:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the mathlib build cache
        run: lake exe cache get
      - name: Build what the cases depend on
        run: lake build PrimeCert.Meta.Sieve PrimeCert.SegmentedSieve
      - name: Large segments, divisors up to 1e7, one round
        run: >
          bash PrimeCertTest/SegTune/run.sh 1 Base0_Startup S7_Sieve
          W7_W1048576 W7_W4194304 W7_W16777216
      - name: Fail the job if any case failed
        run: |
          if [ -s bench-failures.txt ]; then
            cat bench-failures.txt
            exit 1
          fi
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: large-size-at-1e7-logs
          path: |
            out-*.txt
            time-*.txt
