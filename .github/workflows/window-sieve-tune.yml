name: Window sieve tuning

on:
  push:
    branches:
      - 'ci/window-sieve-tune'
  workflow_dispatch:

jobs:
  small-batch-large-segment-at-1e7:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the mathlib build cache
        run: lake exe cache get
      - name: Build what the cases depend on
        run: lake build PrimeCert.Meta.Sieve PrimeCert.SegmentedSieve
      - name: Batches of 1536 at large segments, divisors up to 1e7, one round
        run: >
          bash PrimeCertTest/SegTune/run.sh 1 Base0_Startup S7_Sieve
          W7_W4194304 C7_W4194304_L1536 C7_W8388608_L1536 C7_W16777216_L1536
      - name: Fail the job if any case failed
        run: |
          if [ -s bench-failures.txt ]; then
            cat bench-failures.txt
            exit 1
          fi
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: small-batch-large-segment-logs
          path: |
            out-*.txt
            time-*.txt
