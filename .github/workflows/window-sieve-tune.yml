name: Window sieve tuning

on:
  push:
    branches:
      - 'ci/window-sieve-tune'
  workflow_dispatch:

jobs:
  mode3-sizes-at-1e7:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the mathlib build cache
        run: lake exe cache get
      - name: Build what the cases depend on
        run: lake build PrimeCert.Meta.Sieve PrimeCert.SegmentedSieve
      - name: Mode 3 at four window and batch settings, divisors up to 1e7, one round
        run: >
          bash PrimeCertTest/SegTune/run.sh 1 S7_Sieve V7_M3
          X7_M3_W8388608_L1536 X7_M3_W4194304_L4096 X7_M3_W8388608_L4096
          X7_M3_W16777216_L1536
      - name: Fail the job if any case failed
        run: |
          if [ -s bench-failures.txt ]; then
            cat bench-failures.txt
            exit 1
          fi
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mode3-sizes-at-1e7-logs
          path: |
            out-*.txt
            time-*.txt
