name: Window sieve tuning

on:
  push:
    branches:
      - 'ci/window-sieve-tune'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the mathlib build cache
        run: lake exe cache get
      - name: Build the sieve and its correctness file
        run: lake build PrimeCert.SieveCorrect PrimeCert.Meta.Sieve PrimeCert.SegmentedSieve
      - name: One segment alone, on the runner that also runs four
        run: |
          chmod +x PrimeCertTest/SegTune/run.sh
          chmod +x PrimeCertTest/SegTune/pair.sh
          LEAN_FLAGS=-DElab.async=false PrimeCertTest/SegTune/run.sh 2 S9_Stripes S7_Sched
      - name: Four at once, the sorted shape, same runner
        run: LEAN_FLAGS=-DElab.async=false PrimeCertTest/SegTune/pair.sh S9_Par1 S9_Par2 S9_Par3 S9_Par4
      - name: Four at once, the committed shape, same runner
        run: LEAN_FLAGS=-DElab.async=false PrimeCertTest/SegTune/pair.sh S7_Par1 S7_Par2 S7_Par3 S7_Par4
      - name: Fail the job if any case failed
        run: |
          if [ -s bench-failures.txt ]; then cat bench-failures.txt; exit 1; fi
